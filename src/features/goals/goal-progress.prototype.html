<!doctype html>
<!-- THROWAWAY UI PROTOTYPE. Question: how can a mobile goal card expose
     target time, target pace and a meaningful gap without opening details?
     Three variants on /goals?variant=A|B|C. Recommendation: A, with its compact
     counterpart on Home. Every performance value below is illustrative.
     No production imports, database, writes, readiness score or predicted PB. -->
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runfolio • ตัวอย่างเป้าหมายบนมือถือ</title>
<style>
  :root{--paper:#fffefb;--ivory:#f5f3ed;--ink:#10221f;--muted:#595d5b;--forest:#274d3e;--lime:#d0eb7d;--soft:#eff7cd;--line:#e9e7e0}
  *{box-sizing:border-box}body{margin:0;padding:16px 0 100px;background:var(--ivory);color:var(--ink);font:16px/1.5 'Noto Sans Thai',Tahoma,system-ui,sans-serif;font-variant-numeric:tabular-nums}button,select{font:inherit;color:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:inherit;text-decoration:none}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--forest);outline-offset:3px}
  .tools{max-width:420px;margin:0 auto 12px;padding:0 16px}.tools p{margin:0 0 8px;font-size:12px;color:var(--muted)}.tools select{width:100%;min-height:44px;padding:8px 12px;border:1px solid #cacbc3;border-radius:10px;background:var(--paper)}.tools-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .phone{position:relative;max-width:420px;min-height:780px;margin:auto;padding-bottom:80px;background:var(--paper);border:1px solid #dad8d0;border-radius:22px;overflow:hidden}.header{padding:17px 20px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:24px;font-weight:750;letter-spacing:-.8px}.avatar{width:36px;height:36px;border-radius:50%;background:var(--ivory);display:grid;place-items:center}.page{padding:0 18px 24px}.title{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:30px;line-height:1.25;margin:10px 0 0;letter-spacing:-1px}h2{font-size:18px;margin:0}.add{width:44px;height:44px;background:var(--ivory);border:0;border-radius:50%;display:grid;place-items:center}.sub{color:var(--muted);font-size:13px;margin:8px 0 18px}.section{margin-top:22px}.muted{color:var(--muted)}.small{font-size:12px}.eyebrow{font-size:12px}.line{height:1px;background:var(--line);margin:16px 0}.pill{display:inline-block;border-radius:99px;background:var(--soft);color:var(--forest);font-size:11px;font-weight:600;padding:4px 10px}.tag{background:var(--lime);color:var(--ink)}.meta{display:flex;justify-content:space-between;gap:10px;font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:0;border-radius:10px;background:var(--forest);color:var(--paper);width:100%;font-weight:600;font-size:14px}.quiet-btn{border:1px solid var(--line);background:transparent;color:var(--forest)}.paper-card{border:1px solid var(--line);border-radius:16px;padding:16px}.hero{background:var(--forest);color:var(--paper);border-radius:20px;padding:18px}.hero .muted{color:#d8e2dc}.hero h2{font-size:29px;line-height:1.2}.hero .line{background:#ffffff30}.hero .pill{color:var(--ink);background:var(--lime)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.stats>div+div{padding-left:14px;border-left:1px solid #ffffff35}.time{font-size:34px;font-weight:700;line-height:1.3;letter-spacing:-1px}.unit{font-size:12px;font-weight:400;letter-spacing:0}.stat-label{font-size:11px;opacity:.85}.pace{font-size:13px;margin-top:3px}.comparison{margin-top:16px;background:var(--soft);color:var(--forest);padding:12px 14px;border-radius:12px}.comparison strong{font-size:19px;display:block}.comparison p{margin:3px 0 0;font-size:12px}.reference{margin:10px 0 0;font-size:11px;color:var(--muted)}.hero .reference{color:#d8e2dc}.sample-log{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px}.empty{margin-top:16px;border:1px dashed #ced9cb;border-radius:12px;padding:14px}.empty p{margin:0 0 12px;font-size:13px}.hero .empty{border-color:#ffffff60}.hero .empty .btn{background:var(--lime);color:var(--ink)}.done{background:var(--soft);color:var(--forest)}.tiny-link{display:flex;align-items:center;justify-content:space-between;min-height:44px;font-size:12px;margin-top:8px}
  .pace-hero{padding:6px 0 16px}.pace-hero .big-pace{font-size:72px;font-weight:750;letter-spacing:-4px;line-height:1.2}.pace-hero .big-pace span{font-size:16px;letter-spacing:0;font-weight:400}.timeline{border-left:2px solid #dce5d2;margin:12px 0 12px 9px;padding:0 0 0 22px}.milestone{position:relative;margin-bottom:24px}.milestone:last-child{margin-bottom:0}.milestone:before{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:#d0d8ce;left:-29px;top:7px;box-shadow:0 0 0 4px var(--paper)}.milestone.current:before{background:var(--forest)}.milestone.target:before{background:var(--lime);outline:2px solid var(--forest)}.milestone strong{font-size:25px;letter-spacing:-.6px}.milestone p{margin:0;font-size:12px;color:var(--muted)}.milestone .value{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.goal-list{margin-top:16px}.list-goal{border-top:1px solid var(--line);padding:16px 0}.list-goal h2{font-size:23px}.list-goal .target-line{font-size:15px;font-weight:600;margin-top:8px}.list-goal .current-line{font-size:13px;color:var(--muted);margin-top:6px}.list-goal .gap{display:inline-block;font-size:12px;font-weight:600;color:var(--forest);background:var(--soft);border-radius:7px;padding:5px 8px;margin-top:10px}.list-goal .name{font-size:12px;font-weight:400;color:var(--muted)}.explain{font-size:12px;line-height:1.7;color:var(--muted);padding-top:10px}.home-today{padding:20px;background:var(--forest);color:var(--paper);border-radius:20px;margin-top:18px}.home-today h2{font-size:27px;margin:10px 0 0}.home-today .distance{font-size:54px;font-weight:700;line-height:1.25;letter-spacing:-2px}.home-today .distance span{font-size:20px;letter-spacing:0}.home-today .btn{background:var(--lime);color:var(--ink);margin-top:14px}.week{display:flex;justify-content:space-between;text-align:center;font-size:12px;padding:14px 0}.week span{display:block}.week .today{background:var(--soft);border-radius:10px;padding:4px 10px}.home-goal{border:1px solid var(--line);border-radius:14px;padding:14px}.home-goal .top{display:flex;justify-content:space-between;align-items:center;gap:8px}.home-goal h2{font-size:24px}.home-goal .target-line{margin-top:7px;font-weight:600;font-size:14px}.home-goal .current-line{font-size:12px;color:var(--muted);margin-top:6px}.home-goal .gap{color:var(--forest);font-size:12px;font-weight:600;margin-top:7px}
  .app-nav{position:absolute;bottom:0;left:0;right:0;border-top:1px solid var(--line);background:var(--paper);display:grid;grid-template-columns:repeat(5,1fr);padding:10px 4px 12px}.nav-item{display:grid;justify-items:center;gap:3px;font-size:10px;color:var(--muted)}.nav-item.active{color:var(--forest);font-weight:700}.nav-item.active svg{stroke-width:2.4}.switcher{position:fixed;z-index:20;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;max-width:calc(100vw - 24px);padding:4px;border-radius:99px;background:#10221f;color:white;box-shadow:0 4px 20px #10221f35}.switcher button{width:44px;height:44px;border:0;background:transparent;color:white;border-radius:50%;font-size:22px}.switcher button:hover{background:#ffffff20}.switcher span{min-width:170px;text-align:center;font-size:12px}.legend{text-align:center;font-size:11px;color:var(--muted);max-width:420px;margin:12px auto 0;padding:0 16px}.toast{margin-top:10px;color:var(--forest);font-size:12px}
  @media(max-width:440px){body{padding-top:12px}.phone{border:0;border-radius:0;min-height:740px}.time{font-size:32px}.page{padding-left:16px;padding-right:16px}.header{padding-left:16px;padding-right:16px}}@media(prefers-reduced-motion:no-preference){.phone{transition:height .15s}}
</style>
<div class="tools">
  <p>ตัวอย่างสำหรับเลือกแบบ • ตัวเลขผลซ้อมทั้งหมดเป็นข้อมูลสมมติ</p>
  <div class="tools-row">
    <label><span class="small">ดูในหน้า</span><select id="surface"><option value="goals">เป้าหมาย</option><option value="home">หน้าหลัก</option></select></label>
    <label><span class="small">สถานะข้อมูล</span><select id="state"><option value="progress">มีผล 5K ให้เทียบ</option><option value="empty">ยังไม่มีผล 5K</option><option value="reached">ทำเวลาได้ตามเป้า</option></select></label>
  </div>
</div>
<div class="phone"><header class="header"><span class="brand">Runfolio</span><span class="avatar">C</span></header><main class="page" id="content"></main><nav class="app-nav" id="nav" aria-label="เมนูหลัก"></nav></div>
<p class="legend" id="state-summary"></p>
<div class="switcher" aria-label="สลับแบบหน้าจอ"><button id="previous" aria-label="แบบก่อนหน้า">‹</button><span id="variant-name"></span><button id="next" aria-label="แบบถัดไป">›</button></div>
<script>
  const variants=['A','B','C'];
  const names={A:'เทียบเวลา · แนะนำ',B:'เส้นทางพัฒนาเพซ',C:'รายการกระชับ'};
  const params=new URLSearchParams(location.search);
  let variant=variants.includes(params.get('variant'))?params.get('variant'):'A';
  let surface=params.get('surface')==='home'?'home':'goals';
  let state=['progress','empty','reached'].includes(params.get('state'))?params.get('state'):'progress';
  const paths={home:'M3 10 12 3l9 7v11h-6v-7H9v7H3z',plan:'M5 5h14v16H5z M8 3v4 M16 3v4 M5 10h14',log:'M12 8v8 M8 12h8',goal:'M20 12a8 8 0 1 1-8-8 M16 3l-4 9 9-4 M16 12a4 4 0 1 1-4-4',stats:'M5 21V12 M12 21V4 M19 21V8',plus:'M12 5v14 M5 12h14',arrow:'m9 5 7 7-7 7',check:'m5 12 4 4L19 6'};
  const icon=name=>`<svg aria-hidden="true" viewBox="0 0 24 24">${name==='log'?'<circle cx="12" cy="12" r="9"/>':''}<path d="${paths[name]||paths.goal}"/></svg>`;
  const result=()=>state==='reached'?{time:'29:40',pace:'5:56',gap:'เร็วกว่าเป้า 0:15',comparison:'ทำเวลาได้ตามเป้าแล้ว',note:'ผล 5K ที่ใช้เทียบ · 12 ต.ค.'}:{time:'32:10',pace:'6:26',gap:'ลดอีก 2:15 ถึงเป้า',comparison:'เหลืออีก 27 วินาที/กม.',note:'ผล 5K ที่ใช้เทียบ · 12 ต.ค.'};
  const empty=()=>`<div class="empty"><p>ยังไม่มีผล 5K ที่ใช้เทียบ</p><button class="btn" data-action="pick">เลือกบันทึกมาเทียบ</button></div>`;
  const gap=()=>{const r=result();return `<div class="comparison"><strong>${r.gap}</strong><p>${state==='reached'?'ผลที่เลือกทำเวลาได้เร็วกว่าเป้าหมาย':r.comparison}</p></div>`};
  const other=()=>`<section class="section"><h2>เป้าหมายอื่น</h2><div class="paper-card" style="margin-top:12px"><div class="row"><div><strong style="font-size:22px">10K</strong><p class="muted small" style="margin:4px 0 0">จบการแข่งขัน · ยังไม่กำหนดวันแข่ง</p></div>${icon('arrow')}</div></div></section>`;
  function VariantA(){const r=result();return `<section class="hero" aria-label="เป้าหมายหลัก"><div class="row"><span class="pill">เป้าหมายหลัก</span>${icon('goal')}</div><div class="row" style="margin-top:14px"><h2>5K</h2><span class="small muted">ทำเวลา</span></div><div class="stats"><div><div class="stat-label">เวลาเป้าหมาย</div><div class="time">29:55</div><div class="pace">Pace 5:59 <span class="unit">/km</span></div></div><div><div class="stat-label">${state==='empty'?'ผล 5K ที่ใช้เทียบ':'ผล 5K ที่ใช้เทียบ'}</div><div class="time">${state==='empty'?'—':r.time}</div><div class="pace">${state==='empty'?'ยังไม่มีผลที่เลือก':`Pace ${r.pace} <span class="unit">/km</span>`}</div></div></div>${state==='empty'?empty():gap()}${state==='empty'?'':`<p class="reference">อ้างอิงบันทึก 12 ต.ค. · กดดูรายละเอียดผลได้</p>`}<div class="line"></div><div class="meta"><span class="muted">ยังไม่กำหนดวันแข่ง</span><span>ดูรายละเอียด ›</span></div></section>${other()}`;}
  function VariantB(){const r=result();return `<section aria-label="เส้นทางพัฒนาเพซ"><div class="row"><span class="pill">5K · เป้าหมายหลัก</span>${icon('goal')}</div><div class="pace-hero"><p class="muted small" style="margin:18px 0 0">Pace เป้าหมาย</p><div class="big-pace">5:59 <span>/km</span></div><div class="muted" style="font-size:13px">เวลาเป้าหมาย 29:55</div></div>${state==='empty'?empty():`<div class="timeline"><div class="milestone"><p>ผลแรกที่ใช้เทียบ · 14 ก.ย.</p><div class="value"><strong>6:48 <span class="unit">/km</span></strong><span class="small muted">34:00</span></div></div><div class="milestone current"><p>ผล 5K ที่เลือก · 12 ต.ค.</p><div class="value"><strong>${r.pace} <span class="unit">/km</span></strong><span class="small muted">${r.time}</span></div></div><div class="milestone target"><p>เป้าหมาย</p><div class="value"><strong>5:59 <span class="unit">/km</span></strong><span class="small muted">29:55</span></div></div></div>${gap()}`}<p class="explain">เทียบเฉพาะผลวิ่งเต็มระยะ 5K ที่เลือกไว้</p></section>${other()}`;}
  function VariantC(){const r=result();return `<section class="goal-list" aria-label="เป้าหมายที่กำลังทำ"><div class="list-goal"><div class="row"><h2>5K <span class="name">ทำเวลา</span></h2><span class="pill">เป้าหมายหลัก</span></div><div class="target-line">เป้า 29:55 <span class="muted" style="font-weight:400">· Pace 5:59</span></div><div class="current-line">${state==='empty'?'ยังไม่มีผล 5K ที่ใช้เทียบ':`ผลที่เลือก ${r.time} · Pace ${r.pace}`}</div>${state==='empty'?`<button class="btn quiet-btn" style="margin-top:12px" data-action="pick">เลือกบันทึกมาเทียบ</button>`:`<span class="gap">${r.gap}</span>`}<div class="tiny-link"><span class="muted">ยังไม่กำหนดวันแข่ง</span><span>รายละเอียด ›</span></div></div><div class="list-goal"><div class="row"><h2>10K <span class="name">จบการแข่งขัน</span></h2>${icon('arrow')}</div><div class="current-line">วิ่งให้จบ 10 กิโลเมตร</div><div class="tiny-link"><span class="muted">ยังไม่กำหนดวันแข่ง</span><span>รายละเอียด ›</span></div></div></section>`;}
  function Home(){const r=result();return `<p class="muted small" style="margin:0">พุธ 14 ตุลาคม</p><h1>สวัสดี Caps</h1><section class="home-today"><span class="pill tag">วันนี้ · 1 เซสชัน</span><h2>Easy Run</h2><div class="distance">6.0 <span>km</span></div><span class="small">Zone 2 · วิ่งสบาย</span><button class="btn" data-action="demo">บันทึกการซ้อม →</button></section><div class="row section"><h2>สัปดาห์นี้</h2><span class="small muted">12–18 ต.ค.</span></div><div class="week">${['จ|12','อ|13','พ|14','พฤ|15','ศ|16','ส|17','อา|18'].map((d,i)=>`<div class="${i===2?'today':''}">${d.split('|')[0]}<span>${d.split('|')[1]}</span><span style="color:var(--forest)">•</span></div>`).join('')}</div><div class="home-goal"><div class="top"><span class="small muted">เป้าหมายหลัก</span>${icon('goal')}</div><div class="top"><h2>5K</h2><span class="small muted">ทำเวลา</span></div><div class="target-line">เป้า 29:55 · Pace 5:59</div><div class="current-line">${state==='empty'?'ยังไม่มีผล 5K ที่ใช้เทียบ':`ผลที่เลือก ${r.time} · Pace ${r.pace}`}</div>${state==='empty'?`<button class="btn quiet-btn" style="margin-top:12px" data-action="pick">เลือกบันทึกมาเทียบ</button>`:`<div class="gap">${r.gap} ›</div>`}</div>`;}
  function render(){const r=result();document.getElementById('surface').value=surface;document.getElementById('state').value=state;document.getElementById('variant-name').textContent=`${variant} — ${names[variant]}`;document.getElementById('content').innerHTML=surface==='home'?Home():`<div class="title"><h1>เป้าหมาย</h1><button class="add" aria-label="เพิ่มเป้าหมาย" data-action="demo">${icon('plus')}</button></div><p class="sub">ตั้งจุดหมายให้การซ้อมของคุณ</p>${({A:VariantA,B:VariantB,C:VariantC})[variant]()}`;document.getElementById('nav').innerHTML=[['home','วันนี้'],['plan','แผนซ้อม'],['log','บันทึก'],['goal','เป้าหมาย'],['stats','สถิติ']].map(([name,label])=>`<div class="nav-item ${(surface==='home'&&name==='home')||(surface==='goals'&&name==='goal')?'active':''}">${icon(name)}<span>${label}</span></div>`).join('');document.getElementById('state-summary').textContent=`แบบ ${variant} · ${surface==='home'?'หน้าหลัก':'หน้าเป้าหมาย'} · เป้า 29:55 / Pace 5:59 · ${state==='empty'?'ยังไม่มีผลเทียบ':`ผลที่เลือก ${r.time} / Pace ${r.pace}`} · ตัวอย่างสมมติ`;const url=new URL(location.href);url.search=new URLSearchParams({variant,surface,state}).toString();history.replaceState(null,'',url);document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{let note=document.querySelector('.toast');if(!note){note=document.createElement('p');note.className='toast';document.getElementById('content').append(note)}note.textContent=el.dataset.action==='pick'?'ตัวอย่าง: ผู้ใช้เลือกผล 5K เต็มระยะจาก Journal มาเทียบ':'ปุ่มสาธิตสำหรับดูรูปแบบหน้าจอ';});}
  function cycle(delta){variant=variants[(variants.indexOf(variant)+delta+variants.length)%variants.length];render();}
  document.getElementById('previous').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.getElementById('surface').onchange=e=>{surface=e.target.value;render()};document.getElementById('state').onchange=e=>{state=e.target.value;render()};document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowRight'){e.preventDefault();cycle(1)}if(e.key==='ArrowLeft'){e.preventDefault();cycle(-1)}});render();
</script>
</html>
